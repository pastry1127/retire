<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>은퇴 자산 인출 시뮬레이터 & 크레바스 방어 플랜</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-orange: #f97316;
      --accent-purple: #ec4899;
      --accent-teal: #14b8a6;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      user-select: none;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .kpi-card .label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .kpi-card .value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scenario-minimal-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--bg-color);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .scenario-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .scenario-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sc-chip {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }

    .sc-chip:hover, .sc-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group.full-width {
      grid-column: 1 / -1;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .input-group input, .input-group select {
      padding: 9px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-color);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chart-legend-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.8rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .legend-box {
      width: 11px;
      height: 11px;
      border-radius: 2px;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 320px;
      background: #090d16;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      overflow: visible;
      padding: 8px;
      touch-action: none;
    }

    svg.chart-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .tooltip {
      position: absolute;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid var(--primary);
      border-radius: 8px;
      font-size: 0.8rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-out;
      z-index: 999;
      color: #f8fafc;
      line-height: 1.4;
      min-width: 180px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
      font-size: 0.85rem;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn-accent {
      background: var(--accent-green);
    }
    .btn-accent:hover {
      background: #059669;
    }

    #copySummaryBox {
      width: 100%;
      height: 110px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      font-family: monospace;
      font-size: 0.85rem;
      display: block;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 헤더 & 모드 토글 -->
  <div class="header">
    <h1>은퇴 자산 인출 시뮬레이터</h1>
    <div class="theme-toggle" onclick="toggleTheme()">
      <span id="themeLabel">☀️ 라이트모드</span>
    </div>
  </div>

  <!-- 상단 핵심 요약 (KPI) -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="label">은퇴 총자산</div>
      <div class="value" id="kpiTotalAsset">0원</div>
    </div>
    <div class="kpi-card">
      <div class="label">월 희망 인출액</div>
      <div class="value" id="kpiMonthlyDraw">0 만 원</div>
    </div>
    <div class="kpi-card">
      <div class="label">초기 연간 인출률</div>
      <div class="value" id="kpiDrawRate">0 %</div>
    </div>
    <div class="kpi-card">
      <div class="label">자산 고갈 예상 연령</div>
      <div class="value" id="kpiDepletionAge" style="color: var(--accent-green);">100세+ 잔여</div>
    </div>
  </div>

  <!-- 인출률 중심 시나리오 바 -->
  <div class="section-card" style="padding: 12px 16px;">
    <div class="scenario-minimal-bar">
      <span class="scenario-label">⚡ 인출률 시나리오:</span>
      <div class="scenario-chips">
        <button class="sc-chip" id="sc1" onclick="applyScenario(3.3)">🛡️ 보수적 3.3%</button>
        <button class="sc-chip active" id="sc2" onclick="applyScenario(4.0)">⚖️ 표준 4.0%</button>
        <button class="sc-chip" id="sc3" onclick="applyScenario(5.0)">🔥 적극적 5.0%</button>
      </div>
    </div>
  </div>

  <!-- 자산 입력 섹션 (원 단위 적용) -->
  <div class="section-card">
    <div class="section-title">💼 1. 보유 계좌별 자산 (원 단위)</div>
    <div class="input-grid">
      <div class="input-group">
        <label for="accGeneral">일반계좌/CMA</label>
        <input type="text" id="accGeneral" value="0" oninput="formatAssetInput(this)">
      </div>
      <div class="input-group">
        <label for="accIsa">중개형 ISA</label>
        <input type="text" id="accIsa" value="0" oninput="formatAssetInput(this)">
      </div>
      <div class="input-group">
        <label for="accPension">연금저축</label>
        <input type="text" id="accPension" value="0" oninput="formatAssetInput(this)">
      </div>
      <div class="input-group">
        <label for="accIrp">IRP 퇴직연금</label>
        <input type="text" id="accIrp" value="0" oninput="formatAssetInput(this)">
      </div>
      <div class="input-group">
        <label for="accAnnuity">연금보험</label>
        <input type="text" id="accAnnuity" value="0" oninput="formatAssetInput(this)">
      </div>
      <div class="input-group">
        <label for="accOverseas">해외계좌</label>
        <input type="text" id="accOverseas" value="0" oninput="formatAssetInput(this)">
      </div>
    </div>
  </div>

  <!-- 조건 설정 섹션 -->
  <div class="section-card">
    <div class="section-title">⚙️ 2. 연금 및 인출/수익률 설정</div>
    <div class="input-grid">
      <div class="input-group">
        <label for="pensionStartAge">국민연금 개시 연령</label>
        <select id="pensionStartAge" onchange="recalculateAll()">
          <option value="60">60세 (조기)</option>
          <option value="65" selected>65세 (정상)</option>
          <option value="70">70세 (연기)</option>
        </select>
      </div>
      <div class="input-group">
        <label for="pensionMonthly">국민연금 월 수령액(만)</label>
        <input type="text" id="pensionMonthly" value="110" oninput="formatAndRecalc(this)">
      </div>
      <div class="input-group">
        <label for="retireAge">은퇴 시점 연령(세)</label>
        <input type="number" id="retireAge" value="59" min="50" max="70" onchange="recalculateAll()">
      </div>
      <div class="input-group">
        <label for="targetWithdrawal">목표 월 생활비(만)</label>
        <input type="text" id="targetWithdrawal" value="300" oninput="onManualWithdrawalChange()">
      </div>
      <div class="input-group">
        <label for="customDrawRate">초기 연간 인출률(%)</label>
        <input type="number" id="customDrawRate" value="4.0" step="0.1" min="1.0" max="15.0" oninput="onCustomRateChange()">
      </div>
      <div class="input-group">
        <label for="inflationRate">연 물가상승률(%)</label>
        <input type="number" id="inflationRate" value="3.0" step="0.1" onchange="recalculateAll()">
      </div>
      <div class="input-group full-width">
        <label for="returnRate">은퇴 후 연 투자 수익률 (%)</label>
        <input type="number" id="returnRate" value="6.0" step="0.1" onchange="recalculateAll()">
      </div>
    </div>
  </div>

  <!-- 첫 번째 차트 -->
  <div class="section-card">
    <div class="chart-header">
      <div class="section-title" style="margin-bottom:0;">
        📈 나이별 총 자산 잔액 & 현금흐름 궤적
      </div>
      <div style="font-size: 0.75rem; color: var(--text-muted);">
        터치/클릭하여 세부 상태 고정 가능
      </div>
    </div>

    <div class="chart-legend-grid">
      <div class="legend-item"><div class="legend-dot" style="background: var(--primary);"></div><span>총 자산 궤적</span></div>
      <div class="legend-item"><div class="legend-dot" style="background: var(--accent-orange);"></div><span>순 인출액</span></div>
      <div class="legend-item"><div class="legend-dot" style="background: var(--accent-green);"></div><span>국민연금</span></div>
      <div class="legend-item"><div class="legend-box" style="background: rgba(236, 72, 153, 0.15); border: 1px dashed var(--accent-purple);"></div><span>크레바스</span></div>
    </div>

    <div class="chart-container" id="chartContainer">
      <div class="tooltip" id="chartTooltip"></div>
      <svg class="chart-svg" id="chartSvg"></svg>
    </div>
  </div>

  <!-- 2번 스택 바 차트 -->
  <div class="section-card">
    <div class="chart-header">
      <div class="section-title" style="margin-bottom:0;">
        📊 계좌별 자산 구성 (Stacked Bar)
      </div>
      <div style="font-size: 0.75rem; color: var(--text-muted);">
        터치/클릭하여 세부 상태 고정 가능
      </div>
    </div>

    <div class="chart-legend-grid">
      <div class="legend-item"><div class="legend-dot" style="background: var(--primary);"></div><span>일반</span></div>
      <div class="legend-item"><div class="legend-dot" style="background: var(--accent-orange);"></div><span>ISA</span></div>
      <div class="legend-item"><div class="legend-dot" style="background: var(--accent-green);"></div><span>연금저축</span></div>
      <div class="legend-item"><div class="legend-dot" style="background: var(--accent-purple);"></div><span>IRP</span></div>
      <div class="legend-item"><div class="legend-dot" style="background: var(--accent-teal);"></div><span>보험</span></div>
      <div class="legend-item"><div class="legend-dot" style="background: #eab308;"></div><span>해외</span></div>
    </div>

    <div class="chart-container" id="barChartContainer">
      <div class="tooltip" id="barChartTooltip"></div>
      <svg class="chart-svg" id="barChartSvg"></svg>
    </div>
  </div>

  <!-- 결과 요약 보고서 및 표 복사 섹션 -->
  <div class="section-card">
    <div class="chart-header">
      <div class="section-title" style="margin-bottom:0;">
        📄 결과 요약 및 표 복사
      </div>
      <div class="btn-group">
        <button class="btn" onclick="copyResultSummary()">요약 복사</button>
        <button class="btn btn-accent" onclick="copyTableForGoogleDocs()">📋 상세 표 복사</button>
      </div>
    </div>
    <textarea id="copySummaryBox" readonly></textarea>
  </div>

</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTsfWHfBBs2owjyhb8FWBRAN3wMN_93WAulOu6mJpDrPubgAakHFJzGS7nTkbi-JmMMbxlycIeQUbFf/pub?gid=1655940963&single=true&output=csv';
  let latestDataPoints = [];

  function formatComma(num) {
    return num.toLocaleString('ko-KR');
  }

  // 쉼표가 포함된 금액 문자열을 정확한 원 단위 정수로 파싱 (예: "17,157,803" -> 17157803)
  function parseExactInt(str) {
    if (!str) return 0;
    const clean = str.toString().replace(/[^0-9]/g, '');
    const num = parseInt(clean, 10);
    return isNaN(num) ? 0 : num;
  }

  async function fetchGoogleSheetsData() {
    if (!CSV_URL) return;
    try {
      const response = await fetch(CSV_URL + '&_t=' + new Date().getTime());
      const text = await response.text();
      
      // 행 단위로 분리
      const rows = text.split(/\r?\n/);
      
      rows.forEach(row => {
        // 셀 분리 시 쌍따옴표 제거
        const cols = row.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
        if (cols.length >= 2) {
          const key = cols[0];
          const val = cols[1];

          if (key.includes('일반계좌')) {
            document.getElementById('accGeneral').value = formatComma(parseExactInt(val));
          } else if (key.includes('ISA')) {
            document.getElementById('accIsa').value = formatComma(parseExactInt(val));
          } else if (key.includes('연금저축')) {
            document.getElementById('accPension').value = formatComma(parseExactInt(val));
          } else if (key.includes('IRP')) {
            document.getElementById('accIrp').value = formatComma(parseExactInt(val));
          } else if (key.includes('연금보험')) {
            document.getElementById('accAnnuity').value = formatComma(parseExactInt(val));
          } else if (key.includes('해외계좌')) {
            document.getElementById('accOverseas').value = formatComma(parseExactInt(val));
          } else if (key.includes('국민연금')) {
            document.getElementById('pensionMonthly').value = formatComma(parseExactInt(val));
          }
        }
      });

      recalculateAll();
    } catch (err) {
      console.error('구글 스프레드시트 데이터 연동 실패:', err);
    }
  }

  function formatAssetInput(inputEl) {
    let num = parseExactInt(inputEl.value);
    inputEl.value = formatComma(num);

    const totalAssetWon = getTotalAssetWon();
    const rate = (parseFloat(document.getElementById('customDrawRate').value) || 4.0) / 100;
    const annualDraw = totalAssetWon * rate;
    const monthlyDraw = Math.round(annualDraw / 12 / 10000);
    document.getElementById('targetWithdrawal').value = formatComma(monthlyDraw);

    recalculateAll();
  }

  function getTotalAssetWon() {
    return ['accGeneral', 'accIsa', 'accPension', 'accIrp', 'accAnnuity', 'accOverseas']
      .reduce((sum, id) => sum + parseExactInt(document.getElementById(id).value), 0);
  }

  function formatAssetDisplay(amountInWon) {
    const totalMan = Math.round(amountInWon / 10000);
    const eok = Math.floor(totalMan / 10000);
    const remainderMan = totalMan % 10000;

    if (eok > 0) {
      if (remainderMan > 0) {
        return `${eok}억 ${formatComma(remainderMan)}만`;
      }
      return `${eok}억 원`;
    }
    return `${formatComma(totalMan)}만 원`;
  }

  function formatAndRecalc(inputEl) {
    let num = parseExactInt(inputEl.value);
    inputEl.value = formatComma(num);
    recalculateAll();
  }

  function onManualWithdrawalChange() {
    document.querySelectorAll('.sc-chip').forEach(b => b.classList.remove('active'));
    const totalAssetWon = getTotalAssetWon();
    const targetMonthlyDraw = parseExactInt(document.getElementById('targetWithdrawal').value);
    if (totalAssetWon > 0) {
      const calculatedRate = ((targetMonthlyDraw * 12 * 10000) / totalAssetWon) * 100;
      document.getElementById('customDrawRate').value = calculatedRate.toFixed(1);
    }
    recalculateAll();
  }

  function onCustomRateChange() {
    document.querySelectorAll('.sc-chip').forEach(b => b.classList.remove('active'));
    const totalAssetWon = getTotalAssetWon();
    const rate = (parseFloat(document.getElementById('customDrawRate').value) || 4.0) / 100;
    const annualDraw = totalAssetWon * rate;
    const monthlyDraw = Math.round(annualDraw / 12 / 10000);

    document.getElementById('targetWithdrawal').value = formatComma(monthlyDraw);
    recalculateAll();
  }

  function toggleTheme() {
    const body = document.body;
    const label = document.getElementById('themeLabel');
    if (body.getAttribute('data-theme') === 'light') {
      body.removeAttribute('data-theme');
      label.textContent = '☀️ 라이트모드';
    } else {
      body.setAttribute('data-theme', 'light');
      label.textContent = '🌙 다크모드';
    }
  }

  function applyScenario(rateVal) {
    document.querySelectorAll('.sc-chip').forEach(b => b.classList.remove('active'));
    if (rateVal === 3.3) document.getElementById('sc1').classList.add('active');
    if (rateVal === 4.0) document.getElementById('sc2').classList.add('active');
    if (rateVal === 5.0) document.getElementById('sc3').classList.add('active');

    document.getElementById('customDrawRate').value = rateVal.toFixed(1);
    onCustomRateChange();
  }

  function recalculateAll() {
    const accGeneral = parseExactInt(document.getElementById('accGeneral').value);
    const accIsa = parseExactInt(document.getElementById('accIsa').value);
    const accPension = parseExactInt(document.getElementById('accPension').value);
    const accIrp = parseExactInt(document.getElementById('accIrp').value);
    const accAnnuity = parseExactInt(document.getElementById('accAnnuity').value);
    const accOverseas = parseExactInt(document.getElementById('accOverseas').value);

    const totalAssetWon = accGeneral + accIsa + accPension + accIrp + accAnnuity + accOverseas;

    const retireAge = parseInt(document.getElementById('retireAge').value, 10) || 59;
    const targetMonthlyDraw = parseExactInt(document.getElementById('targetWithdrawal').value);
    const pensionStartAge = parseInt(document.getElementById('pensionStartAge').value, 10) || 65;
    const pensionMonthly = parseExactInt(document.getElementById('pensionMonthly').value);
    const inflationRate = (parseFloat(document.getElementById('inflationRate').value) || 3.0) / 100;
    const returnRate = (parseFloat(document.getElementById('returnRate').value) || 6.0) / 100;

    document.getElementById('kpiTotalAsset').textContent = formatAssetDisplay(totalAssetWon);
    document.getElementById('kpiMonthlyDraw').textContent = formatComma(targetMonthlyDraw) + ' 만 원';

    const annualDrawInitial = targetMonthlyDraw * 12 * 10000;
    const initialDrawRate = totalAssetWon > 0 ? ((annualDrawInitial / totalAssetWon) * 100).toFixed(1) : 0;
    document.getElementById('kpiDrawRate').textContent = initialDrawRate + ' %';

    let subGen = accGeneral;
    let subIsa = accIsa;
    let subPen = accPension;
    let subIrp = accIrp;
    let subAnn = accAnnuity;
    let subOvs = accOverseas;

    const baseYear = 2040 - 65;
    let depletionAge = null;
    const dataPoints = [];

    for (let i = 0; i <= (95 - retireAge); i++) {
      const age = retireAge + i;
      const year = baseYear + age;
      const totalSub = subGen + subIsa + subPen + subIrp + subAnn + subOvs;

      const currentAnnualNeed = annualDrawInitial * Math.pow(1 + inflationRate, i);
      const annualPension = (age >= pensionStartAge) ? (pensionMonthly * 10000 * 12 * Math.pow(1 + inflationRate, Math.max(0, age - pensionStartAge))) : 0;
      const netWithdrawal = Math.max(0, currentAnnualNeed - annualPension);

      if (i > 0 && totalSub > 0) {
        subGen = Math.max(0, (subGen - netWithdrawal * (subGen / totalSub)) * (1 + returnRate));
        subIsa = Math.max(0, (subIsa - netWithdrawal * (subIsa / totalSub)) * (1 + returnRate));
        subPen = Math.max(0, (subPen - netWithdrawal * (subPen / totalSub)) * (1 + returnRate));
        subIrp = Math.max(0, (subIrp - netWithdrawal * (subIrp / totalSub)) * (1 + returnRate));
        subAnn = Math.max(0, (subAnn - netWithdrawal * (subAnn / totalSub)) * (1 + returnRate));
        subOvs = Math.max(0, (subOvs - netWithdrawal * (subOvs / totalSub)) * (1 + returnRate));
      }

      const calculatedTotal = subGen + subIsa + subPen + subIrp + subAnn + subOvs;
      if (calculatedTotal <= 0 && depletionAge === null) depletionAge = age;

      dataPoints.push({
        age, year,
        balance: calculatedTotal,
        gen: subGen, isa: subIsa, pen: subPen, irp: subIrp, ann: subAnn, ovs: subOvs,
        annualNeed: Math.round(currentAnnualNeed / 120000),
        pensionMonthly: Math.round(annualPension / 120000),
        netWithdrawalAnnual: Math.round(netWithdrawal / 10000),
        annualPensionTotal: Math.round(annualPension / 10000)
      });
    }

    latestDataPoints = dataPoints;
    const kpiDep = document.getElementById('kpiDepletionAge');
    if (depletionAge !== null) {
      kpiDep.textContent = depletionAge + '세 고갈 위험';
      kpiDep.style.color = 'var(--accent-red)';
    } else {
      kpiDep.textContent = '100세+ 잔여 (안전)';
      kpiDep.style.color = 'var(--accent-green)';
    }

    renderAdvancedChart(dataPoints, retireAge, pensionStartAge);
    renderStackedBarChart(dataPoints, pensionStartAge);
    updateSummaryText(totalAssetWon, accGeneral, accIsa, accPension, accIrp, accAnnuity, accOverseas, targetMonthlyDraw, depletionAge);
  }

  function renderAdvancedChart(dataPoints, retireAge, pensionStartAge) {
    const svg = document.getElementById('chartSvg');
    const container = document.getElementById('chartContainer');
    const tooltip = document.getElementById('chartTooltip');
    svg.innerHTML = '';

    const width = container.clientWidth > 0 ? container.clientWidth : 500;
    const height = container.clientHeight > 0 ? container.clientHeight : 320;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

    const paddingLeft = 55, paddingRight = 15, paddingTop = 25, paddingBottom = 30;
    const maxBal = Math.max(...dataPoints.map(d => d.balance), 100000000);
    const maxFlow = Math.max(...dataPoints.map(d => Math.max(d.netWithdrawalAnnual, d.annualPensionTotal)), 1000);

    const getX = (idx) => paddingLeft + (idx / (dataPoints.length - 1)) * (width - paddingLeft - paddingRight);
    const getYBal = (val) => height - paddingBottom - (val / maxBal) * (height - paddingTop - paddingBottom);
    const getYFlow = (val) => height - paddingBottom - (val / maxFlow) * (height - paddingTop - paddingBottom) * 0.4;

    const xAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    xAxis.setAttribute('x1', paddingLeft); xAxis.setAttribute('y1', height - paddingBottom);
    xAxis.setAttribute('x2', width - paddingRight); xAxis.setAttribute('y2', height - paddingBottom);
    xAxis.setAttribute('stroke', '#64748b'); xAxis.setAttribute('stroke-width', '1.5');
    svg.appendChild(xAxis);

    const yAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    yAxis.setAttribute('x1', paddingLeft); yAxis.setAttribute('y1', paddingTop);
    yAxis.setAttribute('x2', paddingLeft); yAxis.setAttribute('y2', height - paddingBottom);
    yAxis.setAttribute('stroke', '#64748b'); yAxis.setAttribute('stroke-width', '1.5');
    svg.appendChild(yAxis);

    const crevasseEndIdx = Math.min(pensionStartAge - retireAge, dataPoints.length - 1);
    if (crevasseEndIdx > 0) {
      const crevasseRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      crevasseRect.setAttribute('x', getX(0)); crevasseRect.setAttribute('y', paddingTop);
      crevasseRect.setAttribute('width', getX(crevasseEndIdx) - getX(0));
      crevasseRect.setAttribute('height', height - paddingTop - paddingBottom);
      crevasseRect.setAttribute('fill', 'rgba(236, 72, 153, 0.08)');
      crevasseRect.setAttribute('stroke', 'rgba(236, 72, 153, 0.3)');
      crevasseRect.setAttribute('stroke-dasharray', '4 4');
      svg.appendChild(crevasseRect);
    }

    for (let i = 0; i <= 4; i++) {
      const yVal = (maxBal / 4) * i;
      const yPos = getYBal(yVal);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', paddingLeft); line.setAttribute('y1', yPos);
      line.setAttribute('x2', width - paddingRight); line.setAttribute('y2', yPos);
      line.setAttribute('stroke', 'rgba(255, 255, 255, 0.07)');
      svg.appendChild(line);

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', paddingLeft - 5); text.setAttribute('y', yPos + 4);
      text.setAttribute('fill', '#94a3b8'); text.setAttribute('font-size', '9.5'); text.setAttribute('text-anchor', 'end');
      text.textContent = (yVal >= 100000000) ? (yVal / 100000000).toFixed(0) + '억' : (yVal / 10000).toFixed(0) + '만';
      svg.appendChild(text);
    }

    dataPoints.forEach((d, i) => {
      if (i % 5 === 0 || d.age === pensionStartAge) {
        const xPos = getX(i);
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', xPos); text.setAttribute('y', height - paddingBottom + 14);
        text.setAttribute('fill', d.age === pensionStartAge ? '#10b981' : '#94a3b8');
        text.setAttribute('font-size', d.age === pensionStartAge ? '10.5' : '9.5');
        text.setAttribute('font-weight', d.age === pensionStartAge ? 'bold' : 'normal');
        text.setAttribute('text-anchor', 'middle');
        text.textContent = `${d.age}세`;
        svg.appendChild(text);
      }
    });

    let pathDraw = '';
    dataPoints.forEach((d, i) => {
      const x = getX(i), y = getYFlow(d.netWithdrawalAnnual);
      pathDraw += (i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`);
    });
    const pDraw = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pDraw.setAttribute('d', pathDraw); pDraw.setAttribute('fill', 'none'); pDraw.setAttribute('stroke', '#f97316'); pDraw.setAttribute('stroke-width', '2'); pDraw.setAttribute('stroke-dasharray', '3 3');
    svg.appendChild(pDraw);

    let pathPension = '';
    dataPoints.forEach((d, i) => {
      const x = getX(i), y = getYFlow(d.annualPensionTotal);
      pathPension += (i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`);
    });
    const pPension = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pPension.setAttribute('d', pathPension); pPension.setAttribute('fill', 'none'); pPension.setAttribute('stroke', '#10b981'); pPension.setAttribute('stroke-width', '2');
    svg.appendChild(pPension);

    let pathBal = '';
    dataPoints.forEach((d, i) => {
      const x = getX(i), y = getYBal(d.balance);
      pathBal += (i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`);
    });
    const pBal = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pBal.setAttribute('d', pathBal); pBal.setAttribute('fill', 'none'); pBal.setAttribute('stroke', '#3b82f6'); pBal.setAttribute('stroke-width', '2.5');
    svg.appendChild(pBal);

    const activeMarker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    activeMarker.setAttribute('r', '5.5'); activeMarker.setAttribute('fill', '#ef4444'); activeMarker.setAttribute('stroke', '#ffffff'); activeMarker.setAttribute('stroke-width', '2');
    activeMarker.style.opacity = '0';
    svg.appendChild(activeMarker);

    let isLocked = false;

    const updatePoint = (clientX) => {
      const rect = svg.getBoundingClientRect();
      const mouseX = clientX - rect.left;
      let closestIdx = 0, minDst = Infinity;
      dataPoints.forEach((d, idx) => {
        const dst = Math.abs(getX(idx) - mouseX);
        if (dst < minDst) { minDst = dst; closestIdx = idx; }
      });

      const d = dataPoints[closestIdx];
      const cx = getX(closestIdx), cy = getYBal(d.balance);

      activeMarker.setAttribute('cx', cx);
      activeMarker.setAttribute('cy', cy);
      activeMarker.style.opacity = '1';

      tooltip.style.opacity = '1';
      let tooltipX = cx + 10, tooltipY = cy - 60;
      if (tooltipX + 200 > width) tooltipX = cx - 210;
      if (tooltipY < 10) tooltipY = cy + 10;

      tooltip.style.left = tooltipX + 'px';
      tooltip.style.top = tooltipY + 'px';
      tooltip.innerHTML = `
        <strong style="color:#60a5fa;">${d.age}세 (${d.year}년)</strong><br/>
        잔여 자산: <b style="color:#ffffff;">${formatAssetDisplay(d.balance)}</b><br/>
        총 생활비(월): ${formatComma(d.annualNeed)} 만 원<br/>
        국민연금(월): <span style="color:#10b981;">${formatComma(d.pensionMonthly)} 만 원</span>
      `;
    };

    container.onmousemove = (e) => { if (!isLocked) updatePoint(e.clientX); };
    container.ontouchmove = (e) => { if (e.touches.length > 0) { isLocked = false; updatePoint(e.touches[0].clientX); } };
    container.ontouchend = (e) => { isLocked = true; if (e.changedTouches.length > 0) updatePoint(e.changedTouches[0].clientX); };
    container.onclick = (e) => { isLocked = !isLocked; if (isLocked) updatePoint(e.clientX); };
    container.onmouseleave = () => { isLocked = false; activeMarker.style.opacity = '0'; tooltip.style.opacity = '0'; };
  }

  function renderStackedBarChart(dataPoints, pensionStartAge) {
    const svg = document.getElementById('barChartSvg');
    const container = document.getElementById('barChartContainer');
    const tooltip = document.getElementById('barChartTooltip');
    svg.innerHTML = '';

    const width = container.clientWidth > 0 ? container.clientWidth : 500;
    const height = container.clientHeight > 0 ? container.clientHeight : 320;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

    const paddingLeft = 55, paddingRight = 15, paddingTop = 20, paddingBottom = 30;
    const maxBal = Math.max(...dataPoints.map(d => d.balance), 100000000);

    const getX = (idx) => paddingLeft + (idx / dataPoints.length) * (width - paddingLeft - paddingRight);
    const getY = (val) => height - paddingBottom - (val / maxBal) * (height - paddingTop - paddingBottom);

    const xAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    xAxis.setAttribute('x1', paddingLeft); xAxis.setAttribute('y1', height - paddingBottom);
    xAxis.setAttribute('x2', width - paddingRight); xAxis.setAttribute('y2', height - paddingBottom);
    xAxis.setAttribute('stroke', '#64748b'); xAxis.setAttribute('stroke-width', '1.5');
    svg.appendChild(xAxis);

    const yAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    yAxis.setAttribute('x1', paddingLeft); yAxis.setAttribute('y1', paddingTop);
    yAxis.setAttribute('x2', paddingLeft); yAxis.setAttribute('y2', height - paddingBottom);
    yAxis.setAttribute('stroke', '#64748b'); yAxis.setAttribute('stroke-width', '1.5');
    svg.appendChild(yAxis);

    for (let i = 0; i <= 4; i++) {
      const yVal = (maxBal / 4) * i;
      const yPos = getY(yVal);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', paddingLeft); line.setAttribute('y1', yPos);
      line.setAttribute('x2', width - paddingRight); line.setAttribute('y2', yPos);
      line.setAttribute('stroke', 'rgba(255, 255, 255, 0.07)');
      svg.appendChild(line);

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', paddingLeft - 5); text.setAttribute('y', yPos + 4);
      text.setAttribute('fill', '#94a3b8'); text.setAttribute('font-size', '9.5'); text.setAttribute('text-anchor', 'end');
      text.textContent = (yVal >= 100000000) ? (yVal / 100000000).toFixed(1) + '억' : (yVal / 10000).toFixed(0) + '만';
      svg.appendChild(text);
    }

    const barWidth = Math.max(3, Math.floor((width - paddingLeft - paddingRight) / dataPoints.length) - 2);

    dataPoints.forEach((d, i) => {
      const x = getX(i) + 1;
      const hGen = (d.gen / maxBal) * (height - paddingTop - paddingBottom);
      const hIsa = (d.isa / maxBal) * (height - paddingTop - paddingBottom);
      const hPen = (d.pen / maxBal) * (height - paddingTop - paddingBottom);
      const hIrp = (d.irp / maxBal) * (height - paddingTop - paddingBottom);
      const hAnn = (d.ann / maxBal) * (height - paddingTop - paddingBottom);
      const hOvs = (d.ovs / maxBal) * (height - paddingTop - paddingBottom);

      let currentY = height - paddingBottom;
      const createRect = (h, color) => {
        if (h <= 0) return null;
        currentY -= h;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x); rect.setAttribute('y', currentY); rect.setAttribute('width', barWidth); rect.setAttribute('height', h);
        rect.setAttribute('fill', color);
        return rect;
      };

      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const r1 = createRect(hGen, '#3b82f6'); if(r1) group.appendChild(r1);
      const r2 = createRect(hIsa, '#f97316'); if(r2) group.appendChild(r2);
      const r3 = createRect(hPen, '#10b981'); if(r3) group.appendChild(r3);
      const r4 = createRect(hIrp, '#ec4899'); if(r4) group.appendChild(r4);
      const r5 = createRect(hAnn, '#14b8a6'); if(r5) group.appendChild(r5);
      const r6 = createRect(hOvs, '#eab308'); if(r6) group.appendChild(r6);
      svg.appendChild(group);

      if (i % 5 === 0 || d.age === pensionStartAge) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x + barWidth / 2); text.setAttribute('y', height - paddingBottom + 14);
        text.setAttribute('fill', d.age === pensionStartAge ? '#10b981' : '#94a3b8');
        text.setAttribute('font-size', d.age === pensionStartAge ? '10.5' : '9.5');
        text.setAttribute('font-weight', d.age === pensionStartAge ? 'bold' : 'normal');
        text.setAttribute('text-anchor', 'middle');
        text.textContent = `${d.age}세`;
        svg.appendChild(text);
      }
    });

    let barLocked = false;
    const updateBarPoint = (clientX) => {
      const rect = svg.getBoundingClientRect();
      const mouseX = clientX - rect.left;
      let closestIdx = 0, minDst = Infinity;
      dataPoints.forEach((d, idx) => {
        const dst = Math.abs((getX(idx) + barWidth / 2) - mouseX);
        if (dst < minDst) { minDst = dst; closestIdx = idx; }
      });

      const d = dataPoints[closestIdx];
      const bx = getX(closestIdx);

      tooltip.style.opacity = '1';
      let tooltipX = bx + 10, tooltipY = getY(d.balance) - 45;
      if (tooltipX + 200 > width) tooltipX = bx - 210;
      if (tooltipY < 10) tooltipY = getY(d.balance) + 10;

      tooltip.style.left = tooltipX + 'px';
      tooltip.style.top = tooltipY + 'px';
      tooltip.innerHTML = `
        <strong style="color:#60a5fa;">${d.age}세 (${d.year}년)</strong><br/>
        일반: ${formatAssetDisplay(d.gen)} | ISA: ${formatAssetDisplay(d.isa)}<br/>
        연금저축: ${formatAssetDisplay(d.pen)} | IRP: ${formatAssetDisplay(d.irp)}<br/>
        보험: ${formatAssetDisplay(d.ann)} | 해외: ${formatAssetDisplay(d.ovs)}<br/>
        <b>총합: <span style="color:#10b981;">${formatAssetDisplay(d.balance)}</span></b>
      `;
    };

    container.onmousemove = (e) => { if (!barLocked) updateBarPoint(e.clientX); };
    container.ontouchmove = (e) => { if (e.touches.length > 0) { barLocked = false; updateBarPoint(e.touches[0].clientX); } };
    container.ontouchend = (e) => { barLocked = true; if (e.changedTouches.length > 0) updateBarPoint(e.changedTouches[0].clientX); };
    container.onclick = (e) => { barLocked = !barLocked; if (barLocked) updateBarPoint(e.clientX); };
    container.onmouseleave = () => { barLocked = false; tooltip.style.opacity = '0'; };
  }

  function updateSummaryText(total, gen, isa, pen, irp, ann, ovs, draw, dep) {
    const text = `[은퇴 자산 인출 및 크레바스 방어 시뮬레이션 결과]\n` +
      `■ 총 자산: ${formatAssetDisplay(total)} (일반:${formatAssetDisplay(gen)}|ISA:${formatAssetDisplay(isa)}|연금:${formatAssetDisplay(pen)}|IRP:${formatAssetDisplay(irp)}|보험:${formatAssetDisplay(ann)}|해외:${formatAssetDisplay(ovs)})\n` +
      `■ 월 인출 희망액: ${formatComma(draw)}만 원\n` +
      `■ 고갈 예상: ${dep !== null ? dep + '세 고갈 위험' : '100세 이상 안정적 유지'}`;
    document.getElementById('copySummaryBox').value = text;
  }

  function copyResultSummary() {
    const box = document.getElementById('copySummaryBox');
    box.select();
    document.execCommand('copy');
    alert('요약이 복사되었습니다!');
  }

  function copyTableForGoogleDocs() {
    if (!latestDataPoints || latestDataPoints.length === 0) return;
    let tsv = "나이\t연도\t총자산(원)\t월생활비(만)\t국민연금(만)\t순인출(만)\n";
    latestDataPoints.forEach(d => {
      tsv += `${d.age}\t${d.year}\t${d.balance}\t${d.annualNeed}\t${d.pensionMonthly}\t${d.netWithdrawalAnnual}\n`;
    });
    navigator.clipboard.writeText(tsv).then(() => {
      alert('📋 상세 표가 복사되었습니다! 엑셀/스프레드시트에 붙여넣으세요.');
    });
  }

  window.addEventListener('resize', recalculateAll);
  window.onload = async () => { await fetchGoogleSheetsData(); recalculateAll(); };
</script>
